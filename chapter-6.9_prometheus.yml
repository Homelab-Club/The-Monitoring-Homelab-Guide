global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: linux-servers
    static_configs:
      - targets:
          - 10.10.20.3:9100
        labels:
          hostname: HC-VM-SERVER03

      - targets:
          - 10.10.20.4:9100
        labels:
          hostname: HC-VM-SERVER04

  - job_name: windows-servers
    static_configs:
      - targets:
          - 10.10.20.2:9182
        labels:
          hostname: HC-VM-SERVER01
