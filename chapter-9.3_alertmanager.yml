global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.example.com:587"
  smtp_from: "homelab-monitoring@example.com"
  smtp_auth_username: "homelab-monitoring@example.com"
  smtp_auth_password: "YOUR_SMTP_PASSWORD"
  smtp_require_tls: true

route:
  receiver: email-notifications
  group_by:
    - alertname
    - instance
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: email-notifications
    email_configs:
      - to: "YOUR_EMAIL_ADDRESS"
        send_resolved: true
